<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation Output</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="output">
  <div class="screen blank" id="screen"><div class="inner"></div></div>
  <script type="module">
    import { CHANNEL_NAME, applyTheme, renderSlide, videoCommand } from "./screen.js";

    const screen = document.getElementById("screen");
    const channel = new BroadcastChannel(CHANNEL_NAME);
    let theme = null;
    let state = null;

    channel.onmessage = (e) => {
      const msg = e.data;
      if (!msg || typeof msg !== "object") return;
      if (typeof msg.cmd === "string") {
        if (["play", "pause", "restart"].includes(msg.cmd)) videoCommand(screen, msg.cmd);
        return;
      }
      if (msg.theme) { theme = msg.theme; applyTheme(screen, theme); }
      if (msg.state) { state = msg.state; }
      // This window only shows the picture. Video sound plays in the operator window, which the browser
      // allows to make sound without anyone having to click here first.
      if (theme && state) renderSlide(screen, state, theme, { mute: true });
    };

    channel.postMessage({ hello: true });

    // Double-click or F to toggle fullscreen
    const toggleFs = () => document.fullscreenElement
      ? document.exitFullscreen()
      : document.documentElement.requestFullscreen();
    document.addEventListener("dblclick", toggleFs);
    document.addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "f") toggleFs(); });
  </script>
</body>
</html>
